name: wordle_flutter
description: Wordle-style game built with Flutter and bloc.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  http: ^1.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words/words.txt
    - assets/words/words_varlen.txt
    - assets/sounds/correct.mp3
    - assets/sounds/wrong.mp3
    - assets/sounds/win.mp3
